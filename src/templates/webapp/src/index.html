<!doctype html>
<html lang="en" itemscope itemtype="http://schema.org/WebSite">
	<head>
		<!-- TODO: Fill metadata -->

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<title>{{name}}</title>

		<!-- Prefetch speculation rules -->
		<!-- dprint-ignore -->
		<script type="speculationrules">
			{
				"prefetch": [{
					"where": { "and": [{ "selector_matches": "a" }, {"href_matches": "/*" }] },
					"eagerness": "moderate",
					"requires": ["anonymous-client-ip-when-cross-origin"]
				}]
			}
		</script>

		<!-- Stylesheet -->
		<link rel="stylesheet" href="./css/index.css" />

		<!-- Print Stylesheet -->
		<link rel="stylesheet" href="./css/print.css" media="print" />

		<!-- Main script -->
		<script src="./js/index.ts" type="module"></script>

		<!-- Page and Social Media metadata -->
		<!-- INFO: Any URL used by Open Graph meta tags has to be the full URL, or else it won't work. -->
		<meta property="og:title" name="twitter:title" itemprop="name" content="{{name}}" />
		<meta property="og:url" name="twitter:url" content="" />
		<meta property="og:locale" itemprop="inLanguage" content="en_US" />

		<meta name="publish_date" property="og:publish_date" content="" />
		<meta property="article:published_time" content="" />
		<meta name="updated_date" property="og:updated_date" content="" />
		<meta property="article:modified_time" content="" />

		<link rel="me" href="" />
		<meta name="author" property="article:author" content="" />
		<meta name="twitter:creator" content="" />
		<meta property="fediverse:creator" content="" />

		<meta name="twitter:site" content="" />
		<meta property="og:site_name" content="" />

		<meta name="description" property="og:description" itemprop="description" content="" />
		<meta name="twitter:description" content="" />

		<meta property="og:image" name="twitter:image" itemprop="image" content="" />
		<meta property="og:image:alt" name="twitter:image:alt" content="" />
		<meta property="og:image:width" content="1024" />
		<meta property="og:image:height" content="1024" />

		<meta name="keywords" property="article:tag" itemprop="keywords" content="" />

		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Social Media Privacy -->
		<meta name="twitter:dnt" content="on" />
		<meta name="twitter:widgets:csp" content="on" />
		<meta name="twitter:widgets:autoload" content="off" />

		<meta name="pinterest" content="nopin" />

		<!-- App Metadata -->
		<link rel="icon" href="/icons/icon.svg" sizes="any" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon" />
		<meta name="theme-color" content="" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Apple metadata -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<!-- Site configuration -->
		<meta name="referrer" content="no-referrer" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="license" href="/LICENSE.txt" />

		<!-- Global URLs -->
		<link rel="canonical" href="" />
		<link rel="sitemap" href="/sitemap.xml" />
		<link rel="alternate" type="application/rss+xml" href="/changelog.rss" title="Changelog (Version History)" />

		<!-- Feed URLs -->
		<link rel="alternate" type="application/rss+xml" href="/feed.rss.xml" title="RSS Feed" />
		<link rel="alternate" type="application/atom+xml" href="/feed.atom.xml" title="Atom Feed" />

		<!-- Alternate formats URLs -->
		<link rel="alternate" type="application/json+oembed" href="" title="oEmbed (JSON)" />
		<link rel="alternate" type="text/xml+oembed" href="" title="oEmbed (XML)" />
		<link rel="alternate" type="text/plain" href="" title="Plain Text Version" />
		<link rel="alternate" type="text/markdown" href="" title="Markdown Version" />

		<!-- Webmention -->
		<link rel="webmention" href="" />
		<link rel="pingback" href="" />
	</head>

	<body></body>
</html>
