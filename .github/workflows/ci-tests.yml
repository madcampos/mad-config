name: "CI Tests"

on:
  pull_request:
    types:
      - "opened"
      - "ready_for_review"
      - "synchronize"
      - "reopened"
  push:
    tags:
      - "*"

jobs:
  unit-tests:
    name: "Unit Tests"
    runs-on: "ubuntu-latest"
    needs: ["lint", "format"]
    env:
      BRANCH_NAME: "${{ github.head_ref || github.ref_name }}"
    concurrency:
      group: "ci-unit-tests-${{ github.workflow }}-${{ github.ref }}"
      cancel-in-progress: true

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup node"
        uses: "actions/setup-node@v7"
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: "Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Run unit tests"
        run: "pnpm test"
