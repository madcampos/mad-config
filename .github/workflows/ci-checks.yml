name: "CI Checks"

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow against"
        required: false
        type: "string"

jobs:
  lint:
    name: "Lint Project"
    runs-on: "ubuntu-latest"
    env:
      BRANCH_NAME: "${{ github.event.inputs.branch || github.head_ref || github.ref_name || 'main' }}"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup node and pnpm"
        uses: "pnpm/setup@v2"
        with:
          cache: true

      - name: "Lint all files"
        run: "pnpm run lint"

  format:
    name: "Check Formatting"
    runs-on: "ubuntu-latest"
    needs: ["lint"]
    env:
      BRANCH_NAME: "${{ github.event.inputs.branch || github.head_ref || github.ref_name || 'main' }}"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup node and pnpm"
        uses: "pnpm/setup@v2"
        with:
          cache: true

      - name: "Check files formatting"
        run: "pnpm run format"
