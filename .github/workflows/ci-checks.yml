name: "CI Checks"

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  lint:
    name: "Lint Project"
    runs-on: "ubuntu-latest"
    env:
      BRANCH_NAME: "${{ github.head_ref || github.ref_name }}"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: Setup node
        uses: "actions/setup-node@v7"
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: "Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Lint all files"
        run: "pnpm run lint"

  format:
    name: "Check Formatting"
    runs-on: "ubuntu-latest"
    needs: ["lint"]
    env:
      BRANCH_NAME: "${{ github.head_ref || github.ref_name }}"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Setup node"
        uses: "actions/setup-node@v7"
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: "Install dependencies"
        run: "pnpm install --frozen-lockfile"

      - name: "Check files formatting"
        run: "pnpm run format"
