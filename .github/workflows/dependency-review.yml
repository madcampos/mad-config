name: Dependency Review

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    tags:
      - "*"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow against"
        required: false
        type: "string"

jobs:
  dependency-review:
    name: "Dependency Review"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    env:
      BRANCH_NAME: "${{ github.event.inputs.branch || github.head_ref || github.ref_name || 'main' }}"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"

      - name: "Dependency Review"
        uses: "actions/dependency-review-action@v5"
        with:
          fail-on-severity: "moderate"
          fail-on-scopes: runtime, development
          allow-licenses: any-OSI
          comment-summary-in-pr: always
