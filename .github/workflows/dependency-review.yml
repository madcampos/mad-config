name: "Dependency Review"

on:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    tags:
      - "*"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  dependency-review:
    name: "Dependency Review"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"

    steps:
      - name: "Dependency Review"
        uses: "actions/dependency-review-action@v5"
        with:
          base-ref: "${{ github.event.pull_request.base.ref || github.base_ref || github.ref_name || 'main' }}"
          head-ref: "${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name || 'main' }}"
          fail-on-severity: "moderate"
          fail-on-scopes: runtime, development
          allow-licenses: any-OSI
          comment-summary-in-pr: always
